<!doctype html>
<html lang="pl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151515" />
    <meta name="apple-mobile-web-app-title" content="Plan Zajęć" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="./icons/calendar-dark.svg" />
    <link id="app-touch-icon" rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-dark.png" />
    <script>
      let theme = "dark";
      try {
        theme = localStorage.getItem("class-schedule-theme") === "light" ? "light" : "dark";
      } catch { /* Storage can be unavailable. */ }
      document.documentElement.dataset.theme = theme;
      document.getElementById("app-favicon").href = `./icons/calendar-${theme}.svg`;
      const systemLight = window.matchMedia("(prefers-color-scheme: light)");
      const updateHomeIcon = () => {
        document.getElementById("app-touch-icon").href = `./icons/apple-touch-${systemLight.matches ? "light" : "dark"}.png`;
      };
      updateHomeIcon();
      systemLight.addEventListener("change", updateHomeIcon);
    </script>
    <meta name="description" content="Przejrzysty plan zajęć dla studentów zarządzania." />
    <title>Plan Zajęć</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
